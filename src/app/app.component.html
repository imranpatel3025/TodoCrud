<div class="container mt-5">
  <div class="row">
    <div class="col-md-6">

      <div class="form-group">
        <label for="">Enter Todo</label>
        <input type="text" class="form-control" #todoItem>

        <button (click)="onAddTodo()" mat-raised-button color="primary" class="btn btn-block mt-3"
          *ngIf="!isEditMode">Add Todo</button>
        <button 
          (click)="onUpdate()"
         mat-raised-button color="primary" class="btn btn-block mt-3" *ngIf="isEditMode">Update Todo</button>
      </div>
    </div>
    <div class="col-md-6">
      <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between" *ngFor="let todo of todosArr">
          <strong> {{todo.todoItem}}</strong>

          <div>
            <button (click)="onEditTodo(todo)" mat-mini-fab color="primary" class="mr-3"
              aria-label="Example icon button with a menu icon">
              <mat-icon>edit</mat-icon>
            </button>

            <button (click)="onRemoveTodo(todo.todoId)" mat-mini-fab color="warn"
              aria-label="Example icon button with a menu icon">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </li>
      </ul>
    </div>
  </div>
</div>
